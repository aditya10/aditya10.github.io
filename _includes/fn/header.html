{%- comment -%} The one top bar for every Field Notes page. On the Desk the name is hidden on desktop and the menu centres. {%- endcomment -%}
<header class="shell-bar">
  <a class="brand" href="/notes/"><b>Field Notes</b>{% unless page.fn_desk %}<span class="label">of an AI Researcher</span>{% endunless %}</a>
  <nav class="shell-nav mono" aria-label="Field Notes">
    <a class="home-btn" href="/" aria-label="Home: Aditya Chinchure's main site"><img src="/assets/img/avatar.png" alt=""><span>Home</span></a>
    <a class="hide-sm" href="/notes/"{% if page.fn_desk %} aria-current="page"{% endif %}>Desk</a>
    <a class="hide-sm" href="/notes/#notebooks">Notebooks</a>
    <a class="hide-sm" href="/notes/a-z/"{% if page.url == "/notes/a-z/" %} aria-current="page"{% endif %}>Index</a>
    <button class="kbd-btn mono" data-action="search" aria-label="Search notes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <span class="txt">Search <kbd>⌘K</kbd></span>
    </button>
    <button class="icon-btn" data-action="theme" aria-label="Switch between paper and night">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>
    </button>
    <button class="icon-btn menu-btn" data-action="menu" aria-label="Open menu" aria-expanded="false" aria-controls="nav-sheet">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h16M4 16h16"/></svg>
    </button>
  </nav>
  <nav class="nav-sheet glass mono" id="nav-sheet" aria-label="Menu" hidden>
    <a href="/notes/"{% if page.fn_desk %} aria-current="page"{% endif %}>Desk</a>
    <a href="/notes/#notebooks">Notebooks</a>
    <a href="/notes/a-z/">Index</a>
  </nav>
</header>
