{%- comment -%} Search overlay. Filters list only notebooks that hold notes. {%- endcomment -%}
<div class="search" role="dialog" aria-modal="true" aria-label="Search notes">
  <div class="glass">
    <input type="search" placeholder="Search every note…" aria-label="Search">
    <div class="filters">
      <button data-filter="all" aria-pressed="true">All</button>
      {%- for nb in site.data.fieldnotes.notebooks %}{% if site.data.fn.by_notebook[nb.id].size > 0 %}
      <button data-filter="{{ nb.name | downcase }}" aria-pressed="false">{{ nb.name }}</button>
      {%- endif %}{% endfor %}
    </div>
    <ul></ul>
  </div>
</div>
